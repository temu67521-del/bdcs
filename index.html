<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bahir Dar Computer School</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="app.js"></script>
<script>renderHeadFoot()</script>

<section class="hero big">
  <h1>Learn Computer Skills in Bahir Dar</h1>
  <p>From typing and MS Office to Java, Python, web development, computer maintenance and software installation — taught by experienced teachers.</p>
  <div class="cta">
    <a class="btn gold" href="#courses">See courses</a>
    <a class="btn out" href="#register">Register now</a>
  </div>
</section>

<div class="strip" id="strip"></div>

<main>
  <h2 class="sec" id="courses" style="margin-top:0">Our courses</h2>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid">Loading courses…</div>

  <h2 class="sec" id="teachers">Our teachers</h2>
  <div class="tgrid" id="teachersGrid"></div>

  <h2 class="sec" id="register">Register for a course</h2>
  <div class="reg">
    <section class="panel">
      <label for="name">Full name</label>
      <input id="name">
      <label for="email">Email</label>
      <input id="email" type="email">
      <label for="phone">Phone (09XXXXXXXX)</label>
      <input id="phone" maxlength="10">
      <label for="course">Course</label>
      <select id="course"></select>
      <p><b>Amount to pay:</b> <span id="fee">—</span></p>
      <label>Payment method</label>
      <div class="pay">
        <label><input type="radio" name="pm" value="Telebirr" checked> Telebirr</label>
        <label><input type="radio" name="pm" value="CBE Birr"> CBE Birr</label>
      </div>
      <label for="ref">Transaction ID from your payment</label>
      <input id="ref">
      <p><button type="button" class="btn wide" id="go">Register</button></p>
      <div id="msg" class="msg"></div>
    </section>
    <aside class="panel paybox" id="paybox"></aside>
  </div>

  <h2 class="sec">Find us</h2>
  <iframe src="https://www.google.com/maps?q=11.5890604,37.3857675&z=16&output=embed"
    width="100%" height="450" style="border:0;border-radius:16px"></iframe>
</main>

<script>
let courses = [], pinfo = {}, cats = [];

function show(f) {
  const list = f ? courses.filter(c => c.category === f) : courses;
  document.getElementById("grid").innerHTML = list.map(card).join("") || "<p>No courses yet.</p>";
}

function buildTabs() {
  const bar = document.getElementById("tabs");
  bar.innerHTML = '<button class="on" data-f="">All courses</button>' +
    cats.map(c => '<button data-f="'+c.slug+'">'+c.icon+" "+c.name+"</button>").join("");
  bar.onclick = e => {
    const b = e.target.closest("button[data-f]");
    if (!b) return;
    bar.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    show(b.dataset.f);
  };
}

function payBox() {
  const c = courses.find(x => x.id == document.getElementById("course").value);
  const m = document.querySelector("[name=pm]:checked").value;
  const n = pinfo[m] || "the school account";
  const price = c ? (c.final_price || c.fee - c.discount) : null;
  document.getElementById("paybox").innerHTML = "<h3>How to pay</h3><ol>"+
    "<li>Send <b>"+(price ? etb(price) : "the course fee")+"</b> by <b>"+m+"</b> to <b>"+n+"</b>.</li>"+
    "<li>Copy the transaction ID from your payment message.</li>"+
    "<li>Enter the transaction ID and press Register.</li>"+
    "<li>The school admin checks your payment and confirms your seat.</li></ol>";
}

function upd() {
  const c = courses.find(x => x.id == document.getElementById("course").value);
  if (!c) { document.getElementById("fee").textContent = "—"; payBox(); return; }
  const final = c.final_price || c.fee - c.discount;
  document.getElementById("fee").textContent = c.discount > 0
    ? etb(final)+" (discounted from "+etb(c.fee)+")" : etb(final);
  payBox();
}

document.getElementById("course").onchange = upd;
document.querySelectorAll("[name=pm]").forEach(r => r.onchange = payBox);

api("/api/pay-info").then(d => { pinfo = d; payBox(); }).catch(()=>{});

api("/api/teachers").then(t => {
  document.getElementById("teachersGrid").innerHTML = t.map(x =>
    '<div class="tcard"><img src="'+(x.photo_url || AVATAR + encodeURIComponent(x.full_name))+'"><h3>'+x.full_name+'</h3><small>'+x.title+'</small><p>'+(x.bio||"")+'</p></div>'
  ).join("");
  window._tc = t.length;
  strip();
}).catch(()=>{});

function strip() {
  if (!courses.length) return;
  const open = courses.reduce((a, c) => a + Math.max(c.max_students - c.enrolled, 0), 0);
  const low = Math.min(...courses.map(c => c.final_price || c.fee - c.discount));
  document.getElementById("strip").innerHTML = [
    [courses.length, "Courses"],
    [cats.length, "Categories"],
    [window._tc || "—", "Teachers"],
    [open, "Open seats"],
    [etb(low), "Lowest price"]
  ].map(x => "<div><b>"+x[0]+"</b>"+x[1]+"</div>").join("");
}

api("/api/courses").then(d => {
  courses = d.courses; cats = d.categories;
  buildTabs(); show(""); strip();
  document.getElementById("course").innerHTML = '<option value="">Choose a course</option>' +
    courses.map(c => {
      const final = c.final_price || c.fee - c.discount;
      return '<option value="'+c.id+'">#'+c.id+' · '+c.name+' — '+etb(final)+'</option>';
    }).join("");
  const id = new URLSearchParams(location.search).get("course");
  if (id) { document.getElementById("course").value = id; upd(); }
}).catch(e => document.getElementById("grid").textContent = "Error: " + e.message);

document.getElementById("go").onclick = async () => {
  const m = document.getElementById("msg"); m.className = "msg";
  if (!/^09\d{8}$/.test(document.getElementById("phone").value)) {
    m.className = "msg err show"; m.textContent = "Phone must look like 09XXXXXXXX."; return;
  }
  if (!document.getElementById("course").value) {
    m.className = "msg err show"; m.textContent = "Please choose a course."; return;
  }
  if (!document.getElementById("ref").value.trim()) {
    m.className = "msg err show"; m.textContent = "Please enter the transaction ID."; return;
  }
  const fd = new FormData();
  fd.append("full_name", document.getElementById("name").value);
  fd.append("email", document.getElementById("email").value);
  fd.append("phone", document.getElementById("phone").value);
  fd.append("course_id", document.getElementById("course").value);
  fd.append("payment_method", document.querySelector("[name=pm]:checked").value);
  fd.append("payer_ref", document.getElementById("ref").value);

  document.getElementById("go").disabled = true;
  m.className = "msg info show"; m.textContent = "Sending…";
  try {
    const d = await api("/api/register", { method: "POST", body: fd });
    m.className = "msg ok show";
    m.innerHTML = "Registered! Ref: <b>"+d.ref+"</b><br>Redirecting to receipt…";
    setTimeout(() => location.href = d.receipt_url, 2500);
  } catch (e) { m.className = "msg err show"; m.textContent = e.message; }
  document.getElementById("go").disabled = false;
};
</script>
</body>
</html>
