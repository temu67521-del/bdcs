<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · BDCS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="app.js"></script>
<script>renderHeadFoot()</script>

<main>
<h2 class="sec" style="margin-top:24px">School Admin</h2>

<div class="panel" id="login" style="max-width:420px;margin:0 auto">
  <h3 style="margin-top:0">Admin login</h3>
  <label for="pw">Password</label>
  <input id="pw" type="password" placeholder="Enter admin password">
  <p><button type="button" class="btn wide" id="in">Log in</button></p>
  <div id="lm" class="msg"></div>
</div>

<div id="dash" hidden>
  <div class="tabs" id="tabbar">
    <button type="button" class="on" data-t="regs">📋 Registrations</button>
    <button type="button" data-t="crs">📚 Courses</button>
    <button type="button" data-t="tch">👨‍🏫 Teachers</button>
    <button type="button" data-t="cat">🏷️ Categories</button>
    <button type="button" class="btn out-dark" id="out" style="margin-left:auto">Log out</button>
  </div>

  <section id="pane-regs">
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
      <input id="q" placeholder="Search…" style="flex:1;min-width:220px;margin:0">
      <button type="button" class="btn" id="csv" style="flex:none">Export CSV</button>
    </div>
    <div class="stats" id="st"></div>
    <div class="wrap-table">
      <table>
        <thead><tr>
          <th>Ref</th><th>Student</th><th>Phone</th><th>Course</th><th>Amount</th>
          <th>Method</th><th>Status</th><th>Date</th><th>Transaction ID</th><th>Action</th>
        </tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </section>

  <section id="pane-crs" hidden>
    <div class="panel" style="margin-bottom:20px">
      <h3 style="margin-top:0">Add / edit a course</h3>
      <input type="hidden" id="f_id">
      <div class="fgrid">
        <div><label>Course name</label><input id="f_name"></div>
        <div><label>Category</label><select id="f_cat"></select></div>
        <div><label>Teacher</label><select id="f_t"></select></div>
        <div><label>Course time</label><input id="f_dur" placeholder="3 Months"></div>
        <div><label>Start date</label><input id="f_start" type="date"></div>
        <div><label>End date</label><input id="f_end" type="date"></div>
        <div><label>Certificate</label><input id="f_cert" value="Certificate of Completion"></div>
        <div><label>Fee (ETB)</label><input id="f_fee" type="number" value="0"></div>
        <div><label>Discount (ETB)</label><input id="f_disc" type="number" value="0"></div>
        <div><label>Class time</label><input id="f_sch"></div>
        <div><label>Student quota</label><input id="f_max" type="number" value="20"></div>
        <div><label>Level</label>
          <select id="f_lvl"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select>
        </div>
        <div><label>Visible</label>
          <label style="font-weight:500"><input id="f_act" type="checkbox" checked> Show</label>
        </div>
      </div>
      <label>Description</label>
      <textarea id="f_desc" rows="2"></textarea>
      <label>Syllabus</label>
      <textarea id="f_syl" rows="5"></textarea>
      <p style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
        <button type="button" class="btn" id="csave">💾 Save course</button>
        <button type="button" class="btn out-dark" id="cclear">➕ New course</button>
      </p>
      <div id="cmsg" class="msg"></div>
    </div>
    <div class="wrap-table">
      <table>
        <thead><tr>
          <th>ID</th><th>Course</th><th>Category</th><th>Teacher</th>
          <th>Duration</th><th>Fee</th><th>Final</th><th>Students</th><th>Level</th><th>Action</th>
        </tr></thead>
        <tbody id="ctb"></tbody>
      </table>
    </div>
  </section>

  <section id="pane-tch" hidden>
    <div class="panel" style="margin-bottom:20px">
      <h3 style="margin-top:0">Add / edit a teacher</h3>
      <input type="hidden" id="t_id">
      <div class="fgrid">
        <div><label>Full name</label><input id="t_name"></div>
        <div><label>Title</label><input id="t_title"></div>
        <div><label>Photo URL</label><input id="t_photo"></div>
      </div>
      <label>Short bio</label>
      <textarea id="t_bio" rows="2"></textarea>
      <p style="display:flex;gap:10px;margin-top:16px">
        <button type="button" class="btn" id="tsave">💾 Save teacher</button>
        <button type="button" class="btn out-dark" id="tclear">➕ New teacher</button>
      </p>
      <div id="tmsg" class="msg"></div>
    </div>
    <div class="wrap-table">
      <table>
        <thead><tr><th>Photo</th><th>Name</th><th>Title</th><th>Bio</th><th>Courses</th><th>Action</th></tr></thead>
        <tbody id="ttb"></tbody>
      </table>
    </div>
  </section>

  <section id="pane-cat" hidden>
    <div class="panel" style="margin-bottom:20px">
      <h3 style="margin-top:0">Add a category</h3>
      <div class="fgrid">
        <div><label>Name</label><input id="g_name"></div>
        <div><label>Slug</label><input id="g_slug"></div>
        <div><label>Icon</label><input id="g_icon" value="📘"></div>
      </div>
      <p style="margin-top:16px"><button type="button" class="btn" id="gsave">💾 Save category</button></p>
      <div id="gmsg" class="msg"></div>
    </div>
    <div class="wrap-table">
      <table>
        <thead><tr><th>Icon</th><th>Name</th><th>Slug</th><th>Action</th></tr></thead>
        <tbody id="gtb"></tbody>
      </table>
    </div>
  </section>
</div>
</main>

<script>
let T = sessionStorage.getItem('bdcs_t');
let rows = [];
let cats = [], tchs = [], clist = [], tlist = [], gcat = [];

const H = () => ({ 'x-admin-token': T });

function showMsg(id, txt, cls) {
  const el = document.getElementById(id);
  el.className = 'msg show ' + (cls || 'info');
  el.textContent = txt;
}
function hideMsg(id) { document.getElementById(id).className = 'msg'; }

function draw() {
  const q = (document.getElementById('q').value || '').toLowerCase();
  const list = rows.filter(r => Object.values(r).join(' ').toLowerCase().includes(q));

  document.getElementById('tb').innerHTML = list.map(r => '<tr>' +
    '<td><b>' + esc(r.tx_ref) + '</b></td>' +
    '<td>' + esc(r.full_name) + '</td>' +
    '<td>' + esc(r.phone) + '</td>' +
    '<td>' + esc(r.course) + '</td>' +
    '<td>' + etb(r.amount) + '</td>' +
    '<td>' + esc(r.payment_method) + '</td>' +
    '<td><span class="badge-status ' + esc(r.status) + '">' + esc(r.status) + '</span></td>' +
    '<td>' + new Date(r.created_at).toLocaleDateString() + '</td>' +
    '<td>' + esc(r.payer_ref || '—') + '</td>' +
    '<td>' + (r.status === 'Pending'
      ? '<button class="mini ok" onclick="act(' + Number(r.id) + ',\'verify\')">✔ Verify</button> ' +
        '<button class="mini no" onclick="act(' + Number(r.id) + ',\'reject\')">✘ Reject</button>'
      : '—') + '</td>' +
  '</tr>').join('') || '<tr><td colspan="10">No registrations found.</td></tr>';

  const paid = rows.filter(r => r.status === 'Paid');
  document.getElementById('st').innerHTML = [
    ['Total students', rows.length],
    ['Paid', paid.length],
    ['Pending', rows.filter(r => r.status === 'Pending').length],
    ['Revenue', etb(paid.reduce((a, r) => a + Number(r.amount), 0))],
  ].map(x => '<div><b>' + x[1] + '</b>' + x[0] + '</div>').join('');
}

async function load() {
  try {
    rows = await api('/api/admin/registrations', { headers: H() });
  } catch (e) {
    sessionStorage.removeItem('bdcs_t');
    T = null;
    return;
  }
  document.getElementById('login').hidden = true;
  document.getElementById('dash').hidden = false;
  draw();
}

document.getElementById('in').onclick = async () => {
  hideMsg('lm');
  try {
    const d = await api('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: 'admin', password: document.getElementById('pw').value }),
    });
    T = d.token;
    sessionStorage.setItem('bdcs_t', T);
    load();
  } catch (e) {
    showMsg('lm', e.message, 'err');
  }
};

async function act(id, a) {
  if (!confirm('Are you sure you want to ' + a + ' this registration?')) return;
  try {
    await api('/api/admin/verify/' + id, {
      method: 'POST',
      headers: Object.assign({}, H(), { 'Content-Type': 'application/json' }),
      body: JSON.stringify({ action: a }),
    });
    rows = await api('/api/admin/registrations', { headers: H() });
    draw();
  } catch (e) { alert(e.message); }
}

document.getElementById('q').oninput = draw;
document.getElementById('out').onclick = () => {
  sessionStorage.removeItem('bdcs_t');
  location.reload();
};

document.getElementById('csv').onclick = async () => {
  const res = await fetch('api.php?route=/api/admin/export.csv', { headers: H() });
  if (!res.ok) return alert('Could not export.');
  const t = await res.text();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([t], { type: 'text/csv' }));
  a.download = 'bdcs-registrations.csv';
  a.click();
};

document.getElementById('tabbar').onclick = e => {
  const b = e.target.closest('button[data-t]');
  if (!b) return;
  document.querySelectorAll('#tabbar button[data-t]').forEach(x => x.classList.toggle('on', x === b));
  ['regs','crs','tch','cat'].forEach(k => document.getElementById('pane-' + k).hidden = (k !== b.dataset.t));
  if (b.dataset.t === 'crs') loadCourses();
  if (b.dataset.t === 'tch') loadTeachers();
  if (b.dataset.t === 'cat') loadCats();
};

async function loadMeta() {
  const d = await api('/api/courses');
  cats = d.categories;
  tchs = await api('/api/teachers');
  document.getElementById('f_cat').innerHTML = cats.map(c => '<option value="' + c.id + '">' + c.icon + ' ' + c.name + '</option>').join('');
  document.getElementById('f_t').innerHTML = '<option value="">— no teacher yet —</option>' +
    tchs.map(t => '<option value="' + t.id + '">' + t.full_name + '</option>').join('');
}

async function loadCourses() {
  try {
    if (!cats.length) await loadMeta();
    clist = await api('/api/admin/courses', { headers: H() });
    drawCourses();
  } catch (e) { showMsg('cmsg', e.message, 'err'); }
}

function drawCourses() {
  document.getElementById('ctb').innerHTML = clist.map(c => {
    const final = c.final_price || c.fee - c.discount;
    return '<tr>' +
      '<td><b>#' + c.id + '</b></td>' +
      '<td>' + esc(c.name) + '</td>' +
      '<td>' + esc(c.category_icon || '') + ' ' + esc(c.category_name || '—') + '</td>' +
      '<td>' + esc(c.teacher_name || '—') + '</td>' +
      '<td>' + esc(c.duration || '—') + '</td>' +
      '<td>' + etb(c.fee) + '</td>' +
      '<td><b>' + etb(final) + '</b></td>' +
      '<td>' + c.enrolled + '/' + c.max_students + '</td>' +
      '<td>' + esc(c.level) + '</td>' +
      '<td>' +
        '<button class="mini neutral" onclick="editCourse(' + c.id + ')">✎ Edit</button> ' +
        '<button class="mini no" onclick="delCourse(' + c.id + ')">🗑 Delete</button>' +
      '</td>' +
    '</tr>';
  }).join('') || '<tr><td colspan="10">No courses yet.</td></tr>';
}

function clearCourse() {
  ['f_id','f_name','f_fee','f_disc','f_dur','f_start','f_end','f_sch','f_desc','f_syl'].forEach(i => document.getElementById(i).value = '');
  document.getElementById('f_cert').value = 'Certificate of Completion';
  document.getElementById('f_max').value = 20;
  document.getElementById('f_lvl').value = 'Beginner';
  document.getElementById('f_act').checked = true;
}

function editCourse(id) {
  const c = clist.find(x => x.id === id);
  if (!c) return;
  document.getElementById('f_id').value = c.id;
  document.getElementById('f_name').value = c.name;
  document.getElementById('f_cat').value = c.category_id;
  document.getElementById('f_t').value = c.teacher_id || '';
  document.getElementById('f_fee').value = Number(c.fee);
  document.getElementById('f_disc').value = Number(c.discount || 0);
  document.getElementById('f_dur').value = c.duration || '';
  document.getElementById('f_start').value = c.start_date || '';
  document.getElementById('f_end').value = c.end_date || '';
  document.getElementById('f_cert').value = c.certificate || 'Certificate of Completion';
  document.getElementById('f_sch').value = c.schedule || '';
  document.getElementById('f_max').value = c.max_students;
  document.getElementById('f_lvl').value = c.level;
  document.getElementById('f_act').checked = !!c.active;
  document.getElementById('f_desc').value = c.description || '';
  document.getElementById('f_syl').value = c.syllabus || '';
  showMsg('cmsg', 'Editing "' + c.name + '"', 'info');
  scrollTo({ top: 0, behavior: 'smooth' });
}

async function delCourse(id) {
  const c = clist.find(x => x.id === id);
  if (!confirm('Delete "' + c.name + '"?')) return;
  try {
    const r = await api('/api/admin/courses/' + id, { method: 'DELETE', headers: H() });
    alert(r.message || 'Done.');
    await loadCourses();
  } catch (e) { alert(e.message); }
}

document.getElementById('cclear').onclick = () => { clearCourse(); hideMsg('cmsg'); };

document.getElementById('csave').onclick = async () => {
  const id = document.getElementById('f_id').value;
  const body = {
    name: document.getElementById('f_name').value,
    category_id: Number(document.getElementById('f_cat').value),
    teacher_id: document.getElementById('f_t').value ? Number(document.getElementById('f_t').value) : null,
    fee: Number(document.getElementById('f_fee').value),
    discount: Number(document.getElementById('f_disc').value),
    duration: document.getElementById('f_dur').value,
    start_date: document.getElementById('f_start').value,
    end_date: document.getElementById('f_end').value,
    certificate: document.getElementById('f_cert').value,
    schedule: document.getElementById('f_sch').value,
    max_students: Number(document.getElementById('f_max').value),
    level: document.getElementById('f_lvl').value,
    active: document.getElementById('f_act').checked,
    description: document.getElementById('f_desc').value,
    syllabus: document.getElementById('f_syl').value,
  };
  try {
    await api(id ? '/api/admin/courses/' + id : '/api/admin/courses', {
      method: id ? 'PUT' : 'POST',
      headers: Object.assign({}, H(), { 'Content-Type': 'application/json' }),
      body: JSON.stringify(body),
    });
    clearCourse();
    await loadCourses();
    showMsg('cmsg', id ? 'Course updated.' : 'Course added.', 'ok');
  } catch (e) { showMsg('cmsg', e.message, 'err'); }
};

async function loadTeachers() {
  try { tlist = await api('/api/admin/teachers', { headers: H() }); drawTeachers(); }
  catch (e) { showMsg('tmsg', e.message, 'err'); }
}

function drawTeachers() {
  document.getElementById('ttb').innerHTML = tlist.map(t => '<tr>' +
    '<td><img src="' + esc(t.photo_url || AVATAR + encodeURIComponent(t.full_name)) + '" style="width:40px;height:40px;border-radius:50%;object-fit:cover"></td>' +
    '<td>' + esc(t.full_name) + '</td>' +
    '<td>' + esc(t.title || '—') + '</td>' +
    '<td>' + esc((t.bio || '').slice(0, 80)) + '</td>' +
    '<td>' + (t.course_count || 0) + '</td>' +
    '<td>' +
      '<button class="mini neutral" onclick="editTeacher(' + t.id + ')">✎ Edit</button> ' +
      '<button class="mini no" onclick="delTeacher(' + t.id + ')">🗑 Delete</button>' +
    '</td>' +
  '</tr>').join('') || '<tr><td colspan="6">No teachers yet.</td></tr>';
}

function clearTeacher() { ['t_id','t_name','t_title','t_photo','t_bio'].forEach(i => document.getElementById(i).value = ''); }

function editTeacher(id) {
  const t = tlist.find(x => x.id === id); if (!t) return;
  document.getElementById('t_id').value = t.id;
  document.getElementById('t_name').value = t.full_name;
  document.getElementById('t_title').value = t.title || '';
  document.getElementById('t_photo').value = t.photo_url || '';
  document.getElementById('t_bio').value = t.bio || '';
  showMsg('tmsg', 'Editing "' + t.full_name + '"', 'info');
}

async function delTeacher(id) {
  const t = tlist.find(x => x.id === id);
  if (!confirm('Delete teacher "' + t.full_name + '"?')) return;
  try {
    await api('/api/admin/teachers/' + id, { method: 'DELETE', headers: H() });
    cats = [];
    await loadTeachers();
    await loadMeta();
  } catch (e) { alert(e.message); }
}

document.getElementById('tclear').onclick = () => { clearTeacher(); hideMsg('tmsg'); };

document.getElementById('tsave').onclick = async () => {
  const id = document.getElementById('t_id').value;
  const body = {
    full_name: document.getElementById('t_name').value,
    title: document.getElementById('t_title').value,
    photo_url: document.getElementById('t_photo').value,
    bio: document.getElementById('t_bio').value,
  };
  try {
    await api(id ? '/api/admin/teachers/' + id : '/api/admin/teachers', {
      method: id ? 'PUT' : 'POST',
      headers: Object.assign({}, H(), { 'Content-Type': 'application/json' }),
      body: JSON.stringify(body),
    });
    clearTeacher(); cats = [];
    await loadTeachers(); await loadMeta();
    showMsg('tmsg', id ? 'Teacher updated.' : 'Teacher added.', 'ok');
  } catch (e) { showMsg('tmsg', e.message, 'err'); }
};

async function loadCats() {
  try { gcat = await api('/api/admin/categories', { headers: H() }); drawCats(); }
  catch (e) { showMsg('gmsg', e.message, 'err'); }
}

function drawCats() {
  document.getElementById('gtb').innerHTML = gcat.map(c => '<tr>' +
    '<td style="font-size:1.5rem">' + esc(c.icon) + '</td>' +
    '<td>' + esc(c.name) + '</td>' +
    '<td><code>' + esc(c.slug) + '</code></td>' +
    '<td><button class="mini no" onclick="delCat(' + c.id + ')">🗑 Delete</button></td>' +
  '</tr>').join('') || '<tr><td colspan="4">No categories yet.</td></tr>';
}

async function delCat(id) {
  if (!confirm('Delete this category?')) return;
  try {
    await api('/api/admin/categories/' + id, { method: 'DELETE', headers: H() });
    cats = []; await loadCats(); await loadMeta();
  } catch (e) { alert(e.message); }
}

document.getElementById('gsave').onclick = async () => {
  const body = {
    name: document.getElementById('g_name').value,
    slug: document.getElementById('g_slug').value.trim().toLowerCase().replace(/\s+/g, '-'),
    icon: document.getElementById('g_icon').value || '📘',
  };
  try {
    await api('/api/admin/categories', {
      method: 'POST',
      headers: Object.assign({}, H(), { 'Content-Type': 'application/json' }),
      body: JSON.stringify(body),
    });
    document.getElementById('g_name').value = '';
    document.getElementById('g_slug').value = '';
    document.getElementById('g_icon').value = '📘';
    cats = []; await loadCats(); await loadMeta();
    showMsg('gmsg', 'Category added.', 'ok');
  } catch (e) { showMsg('gmsg', e.message, 'err'); }
};

if (T) load();
</script>
</body>
</html>
